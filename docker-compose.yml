services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fitgraph
      POSTGRES_USER: fitgraph
      POSTGRES_PASSWORD: fitgraph_dev
    ports:
      - "5432:5432"
    volumes:
      - fitgraph_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitgraph -d fitgraph"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://fitgraph:fitgraph_dev@postgres:5432/fitgraph
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  fitgraph_pg:
